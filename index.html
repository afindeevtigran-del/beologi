<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор накоплений</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  padding: 30px;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
  margin-bottom: 25px;
}

label {
  font-weight: bold;
  margin-bottom: 6px;
  display: block;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

button:hover {
  background: #43a047;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 25px 10px; /* расстояние между столбцами */
  margin-top: 30px;
  font-size: 17px;
}

th {
  background: #f4f6f8;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
}

td {
  padding: 12px;
  text-align: right;
}

td:first-child {
  text-align: center;
  font-weight: bold;
}

.caption {
  margin-top: 25px;
  font-size: 15px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">
  <h1>💰 Калькулятор накоплений</h1>

  <div class="inputs">
    <div>
      <label>Начальная сумма</label>
      <input type="number" id="sum" value="100000">
    </div>

    <div>
      <label>Количество месяцев</label>
      <input type="number" id="months" value="12">
    </div>
  </div>

  <button onclick="calculate()">Рассчитать</button>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>Месяц</th>
        <th>20% (накопительный)</th>
        <th>Чистая прибыль</th>
        <th>15% (обычный)</th>
        <th>Чистая прибыль</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="caption">
    🔹 <b>20% (накопительный)</b> — сложный процент (эффективная ставка)<br>
    🔹 <b>15% (обычный)</b> — номинальная ставка, начисление по месяцам
  </div>
</div>

<script>
function calculate() {
  const initial = Number(document.getElementById("sum").value);
  const months = Number(document.getElementById("months").value);

  const rate20 = Math.pow(1 + 0.20, 1/12) - 1; // накопительный
  const rate15 = 0.15 / 12;                  // обычный

  let balance20 = initial;
  let balance15 = initial;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  for (let i = 1; i <= months; i++) {
    balance20 += balance20 * rate20;
    balance15 += balance15 * rate15;

    const profit20 = balance20 - initial;
    const profit15 = balance15 - initial;

    const row = `
      <tr>
        <td>${i}</td>
        <td>${balance20.toFixed(2)}</td>
        <td>${profit20.toFixed(2)}</td>
        <td>${balance15.toFixed(2)}</td>
        <td>${profit15.toFixed(2)}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  }

  document.getElementById("table").style.display = "table";
}
</script>

</body>
</html>
