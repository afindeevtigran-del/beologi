<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Биология 9 класс — тест</title>
<style>
body {
    font-family: Arial;
    background: #eaf6f0;
    padding: 20px;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    max-width: 750px;
    margin: auto;
}
button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    font-size: 16px;
}
.timer {
    color: red;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
<h2>Тест по биологии (9 класс, углублённый)</h2>
<p id="question"></p>
<div id="answers"></div>
<p class="timer">Время: <span id="time">25</span> сек</p>
</div>

<script>
const questions = [
{q:"Какой органоид отвечает за синтез АТФ?",a:["Рибосомы","Лизосомы","Митохондрии","Аппарат Гольджи"],c:2},
{q:"Какая молекула является носителем наследственной информации?",a:["РНК","АТФ","ДНК","Белок"],c:2},
{q:"Где происходит фотосинтез?",a:["Митохондрии","Хлоропласты","Ядро","Вакуоль"],c:1},
{q:"Какой тип деления обеспечивает рост организма?",a:["Мейоз","Амитоз","Митоз","Бинарное"],c:2},
{q:"Сколько хромосом у человека в соматической клетке?",a:["23","44","46","48"],c:2},
{q:"Какую функцию выполняют рибосомы?",a:["Синтез липидов","Синтез белка","Хранение ДНК","Транспорт веществ"],c:1},
{q:"Какой орган относится к эндокринной системе?",a:["Сердце","Лёгкие","Щитовидная железа","Печень"],c:2},
{q:"Основная функция эритроцитов?",a:["Иммунная защита","Свёртывание крови","Перенос кислорода","Пищеварение"],c:2},
{q:"Как называется процесс образования гамет?",a:["Митоз","Мейоз","Онтогенез","Филогенез"],c:1},
{q:"Какой витамин синтезируется в коже под действием света?",a:["A","B₁","C","D"],c:3},

{q:"Какая ткань проводит нервные импульсы?",a:["Соединительная","Мышечная","Эпителиальная","Нервная"],c:3},
{q:"Какая кровь течёт по лёгочной артерии?",a:["Артериальная","Венозная","Смешанная","Капиллярная"],c:1},
{q:"Какой орган выделяет желчь?",a:["Желудок","Печень","Поджелудочная","Кишечник"],c:1},
{q:"Какой процесс происходит в альвеолах лёгких?",a:["Пищеварение","Газообмен","Фильтрация","Синтез гормонов"],c:1},
{q:"Как называется совокупность всех генов организма?",a:["Генотип","Фенотип","Кариотип","Геном"],c:3},
{q:"Какая группа крови является универсальным донором?",a:["I (O)","II (A)","III (B)","IV (AB)"],c:0},
{q:"Что является структурной единицей почки?",a:["Нефрон","Альвеола","Аксон","Капилляр"],c:0},
{q:"Какой отдел мозга отвечает за координацию движений?",a:["Продолговатый","Мозжечок","Большие полушария","Гипоталамус"],c:1},
{q:"Какой процесс обеспечивает постоянство внутренней среды?",a:["Фотосинтез","Гомеостаз","Метаболизм","Эволюция"],c:1},
{q:"Какая система отвечает за защиту организма?",a:["Кровеносная","Дыхательная","Иммунная","Выделительная"],c:2},

{q:"Какая ткань образует сухожилия?",a:["Эпителиальная","Соединительная","Мышечная","Нервная"],c:1},
{q:"Как называется внешнее дыхание?",a:["Газообмен в тканях","Газообмен в лёгких","Клеточное дыхание","Окисление"],c:1},
{q:"Какой гормон регулирует уровень глюкозы?",a:["Адреналин","Инсулин","Тироксин","Соматотропин"],c:1},
{q:"Где происходит переваривание белков?",a:["Рот","Желудок","Толстый кишечник","Пищевод"],c:1},
{q:"Какая часть уха отвечает за равновесие?",a:["Улитка","Барабанная перепонка","Полукружные каналы","Слуховая труба"],c:2},
{q:"Как называется развитие организма от зиготы?",a:["Филогенез","Онтогенез","Мутация","Регенерация"],c:1},
{q:"Какой орган относится к иммунной системе?",a:["Селезёнка","Почки","Желудок","Лёгкие"],c:0},
{q:"Какой тип мутаций затрагивает одну пару нуклеотидов?",a:["Генные","Хромосомные","Геномные","Полиплоидия"],c:0},
{q:"Какое вещество является основным источником энергии?",a:["Белки","Витамины","Углеводы","Минералы"],c:2},
{q:"Какая структура клетки отвечает за транспорт белков?",a:["Ядро","Рибосомы","Аппарат Гольджи","Лизосомы"],c:2},
];

// 🔀 НОРМАЛЬНЫЙ РАНДОМАЙЗЕР (Фишер–Йейтс)
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

shuffle(questions);
const test = questions.slice(0, 15);

let index = 0;
let score = 0;
let time = 25;
let timer;

function showQuestion() {
    if (index >= test.length) {
        document.body.innerHTML =
        `<h2>Результат: ${score} из 15<br>Оценка: ${getGrade()}</h2>`;
        return;
    }

    document.getElementById("question").innerText =
        (index + 1) + ". " + test[index].q;

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    test[index].a.forEach((text, i) => {
        let btn = document.createElement("button");
        btn.innerText = text;
        btn.onclick = () => answer(i);
        answers.appendChild(btn);
    });

    resetTimer();
}

function answer(i) {
    if (i === test[index].c) score++;
    index++;
    showQuestion();
}

function resetTimer() {
    clearInterval(timer);
    time = 25;
    document.getElementById("time").innerText = time;

    timer = setInterval(() => {
        time--;
        document.getElementById("time").innerText = time;
        if (time === 0) {
            clearInterval(timer);
            index++;
            showQuestion();
        }
    }, 1000);
}

function getGrade() {
    if (score >= 13) return 5;
    if (score >= 10) return 4;
    if (score >= 7) return 3;
    return 2;
}

showQuestion();
</script>

</body>
</html>
